name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: goreleaser
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches plugin.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # The tag must be v<semver> and match plugin.json. The shim derives
          # its binary download target from plugin.json's version, and Claude
          # Code uses that same version as the plugin's update signal, so a
          # mismatch pins consumers to the wrong release. Fail the release
          # before GoReleaser publishes.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid v<semver> release tag"
            exit 1
          fi

          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          if [[ "$PLUGIN_VERSION" != "$VERSION" ]]; then
            echo "::error::.claude-plugin/plugin.json version ($PLUGIN_VERSION) does not match tag ($VERSION). Bump plugin.json before tagging."
            exit 1
          fi

          # The marketplace entry pins a release commit and must not set a
          # version: plugin.json at the pinned commit decides it, and an entry
          # version would be easy to bump by habit without moving the pin.
          MP_VERSION=$(jq -r --arg n "$PLUGIN_NAME" \
            '.plugins[] | select(.name == $n) | .version // empty' \
            .claude-plugin/marketplace.json)
          if [[ -n "$MP_VERSION" ]]; then
            echo "::error::marketplace.json entry for '$PLUGIN_NAME' sets \"version\" ($MP_VERSION). Remove it: the entry pins a release commit, and plugin.json at that commit decides the version."
            exit 1
          fi

          echo "Version guard passed: tag=$VERSION plugin.json=$PLUGIN_VERSION"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Require committed checksums.txt
        run: test -f checksums.txt || { echo "::error::checksums.txt is missing; run 'make checksums' and commit it"; exit 1; }
      - name: Use the exact Go toolchain pinned in go.mod
        run: echo "GOTOOLCHAIN=$(awk '/^toolchain /{print $2}' go.mod)" >> "$GITHUB_ENV"
      # GoReleaser is pinned to an exact version: this job holds a
      # contents:write token, so the tool it runs changes only through a
      # reviewed PR. Keep both steps here and checks.yml on the same version.
      - name: Build a snapshot (no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Verify built binaries match the committed checksums
        run: diff -u <(LC_ALL=C sort -k2 checksums.txt) <(LC_ALL=C sort -k2 dist/checksums.txt)
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Download, verify and run the just-published binaries through the real hook
  # shim on Linux, macOS, Windows x64 and Windows ARM64. Runs on every tag,
  # including release candidates. The release is already public at this point;
  # a failure here means: don't announce it, fix, and cut the next version.
  smoke:
    name: release smoke
    needs: [release]
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
