name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform on a failure rather than cancelling the others:
      # a Windows-only break should not hide the Linux result, or vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          # No -race on Windows: it needs cgo and a C toolchain the images
          # don't promise. windows-latest is x64 (Windows Server); windows-11-arm
          # is ARM64 (Windows 11). Both ship Git for Windows, so test/shim runs
          # the hook shim through Git Bash as Claude Code does.
          - os: windows-latest
            race: ""
          - os: windows-11-arm
            race: ""
    # bash on every OS (Git Bash on Windows) so the steps below are identical.
    defaults:
      run:
        shell: bash
    steps:
      # Show the line-ending setting the checkout below runs under. On Windows
      # images Git for Windows defaults to core.autocrlf=true; .gitattributes
      # must still give LF scripts, which test/shim then exercises.
      - name: Git line-ending config
        run: git config --show-origin --get core.autocrlf || echo "core.autocrlf unset"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: scripts/on-event.sh is LF
        run: |
          if grep -q $'\r' scripts/on-event.sh; then
            echo "::error::scripts/on-event.sh was checked out with CRLF line endings"; exit 1
          fi
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test ${{ matrix.race }} ./...

  # CI gate over the OS matrix and the checksum check: one stable result that
  # passes only when every platform passed and the checksum check passed or was
  # skipped (it runs only on PRs, so it is skipped on tag pushes). Adding or
  # removing a platform doesn't change which checks a merge waits on.
  build-and-test:
    name: build & test
    needs: [test, checksums]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All platforms and the checksum check passed
        env:
          TEST: ${{ needs.test.result }}
          CHECKSUMS: ${{ needs.checksums.result }}
        run: |
          echo "test=${TEST} checksums=${CHECKSUMS}"
          [ "${TEST}" = "success" ] && { [ "${CHECKSUMS}" = "success" ] || [ "${CHECKSUMS}" = "skipped" ]; }

  lint:
    name: lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-clean:"; echo "$out"; exit 1
          fi
      - name: bash -n scripts/on-event.sh
        run: bash -n scripts/on-event.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      # Same linters with Windows build constraints, so Windows-only code paths
      # and Windows-specific API misuse are checked too.
      - name: golangci-lint (GOOS=windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.15.0

  # When a PR changes checksums.txt or plugin.json's version, rebuild the release
  # binaries with the pinned toolchain and confirm they match the committed file.
  # main may lag behind Go changes between releases, so other PRs skip the
  # comparison. A release bump PR that forgets `make checksums` fails here
  # instead of at tag time; tag pushes are covered by the gate in release.yml.
  checksums:
    name: checksums up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did this PR change checksums.txt or the plugin version?
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/${BASE_REF}" HEAD)
          base_version=$(git show "${base}:.claude-plugin/plugin.json" | jq -r .version)
          head_version=$(jq -r .version .claude-plugin/plugin.json)
          if ! git diff --quiet "$base" HEAD -- checksums.txt; then
            echo "checksums.txt changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$base_version" != "$head_version" ]; then
            echo "plugin.json version changed: ${base_version} -> ${head_version}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "neither checksums.txt nor the plugin version changed; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Use the exact Go toolchain pinned in go.mod
        if: steps.changed.outputs.run == 'true'
        run: echo "GOTOOLCHAIN=$(awk '/^toolchain /{print $2}' go.mod)" >> "$GITHUB_ENV"
      - name: Build a snapshot (no publish)
        if: steps.changed.outputs.run == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Keep in sync with release.yml, so this check builds with the same
          # GoReleaser the release does.
          version: v2.20.0
          args: release --snapshot --clean
      - name: Verify committed checksums match a fresh build
        if: steps.changed.outputs.run == 'true'
        run: diff -u <(LC_ALL=C sort -k2 checksums.txt) <(LC_ALL=C sort -k2 dist/checksums.txt)
