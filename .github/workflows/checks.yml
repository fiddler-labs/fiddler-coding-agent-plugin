name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: fdl-small
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: lint & format
    runs-on: fdl-small
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-clean:"; echo "$out"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
