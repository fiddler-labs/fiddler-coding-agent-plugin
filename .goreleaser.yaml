# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: on-event

version: 2

builds:
  - id: on-event
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    # Windows builds get GoReleaser's automatic ".exe" suffix, so the assets are
    # on-event-windows-<arch>.exe. scripts/on-event.sh derives the same name.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    dir: ./
    main: ./cmd/on-event
    binary: "on-event-{{ .Os }}-{{ .Arch }}"
    no_unique_dist_dir: true

archives:
  - formats: ["binary"]
    name_template: "{{ .Binary }}"

checksum:
  name_template: "checksums.txt"

release:
  prerelease: auto
  mode: replace

changelog:
  disable: false
